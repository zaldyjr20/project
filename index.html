<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BudgetWise - Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- LOGIN / REGISTER -->
  <div id="auth-section" class="card">
    <h2 id="auth-title">Welcome to BudgetWise</h2>

    <form id="auth-form">

      <div id="name-group" class="form-group hidden">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label for="auth-username">Username</label>
        <input type="text" id="auth-username"
               required placeholder="Enter username">
      </div>

      <div class="form-group">
        <label for="auth-password">Password</label>
        <input type="password" id="auth-password"
               required placeholder="Enter password">
      </div>

      <div id="confirm-password-group" class="form-group hidden">
        <label for="confirm-password">Re-type New Password</label>
        <input type="password" id="confirm-password"
               placeholder="Re-type new password">
      </div>

      <div class="auth-actions">
        <button type="submit" id="auth-btn">Login</button>

        <button type="button" id="auth-toggle-btn" class="secondary">
          Create Account
        </button>
      </div>

      <p id="auth-message"></p>
    </form>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard-section" class="hidden">

    <header class="user-bar">
      <h2>BudgetWise</h2>

      <div>
        Welcome, <strong id="user-display-name">User</strong>

        <button type="button" id="logout-btn" class="logout-btn">
          Logout
        </button>
      </div>
    </header>

    <!-- MONTHLY BUDGET -->
    <div class="card">
      <h3>Monthly Budget Tracker</h3>

      <form id="budget-form" class="grid-2">

        <div class="form-group">
          <label for="monthly-budget">Monthly Budget Limit (₱)</label>
          <input type="number" id="monthly-budget"
                 min="0.01" step="0.01" required
                 placeholder="Enter budget">
        </div>

        <div class="form-group btn-align-end">
          <button type="submit">Set Budget</button>
        </div>

      </form>

      <div class="progress-container">
        <div id="budget-progress-bar" class="progress-bar"></div>
      </div>

      <p id="budget-status-text">
        Spent: ₱0.00 / ₱0.00 (0.0%) | Remaining: ₱0.00
      </p>
    </div>

    <!-- EXPENSE SUMMARY -->
    <div class="card">
      <h3>Expense Summary</h3>

      <div class="grid-3">

        <div class="summary-card">
          <span>Today's Total</span>
          <strong id="daily-total">₱0.00</strong>
        </div>

        <div class="summary-card">
          <span>This Week</span>
          <strong id="weekly-total">₱0.00</strong>
        </div>

        <div class="summary-card">
          <span>Total Spent</span>
          <strong id="overall-total">₱0.00</strong>
        </div>

      </div>
    </div>

    <!-- ADD EXPENSE -->
    <div class="card">
      <h3>Add New Expense</h3>

      <form id="expense-form">

        <div class="grid-2">
          <div class="form-group">
            <label for="expense-amount">Amount (₱)</label>
            <input type="number" id="expense-amount"
                   min="0.01" step="0.01" required
                   placeholder="0.00">
          </div>

          <div class="form-group">
            <label for="expense-category">Category</label>

            <select id="expense-category" required>
              <option value="Food & Dining">Food & Dining</option>
              <option value="Housing & Utilities">Housing & Utilities</option>
              <option value="Transportation">Transportation</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Shopping">Shopping</option>
              <option value="Education">Education</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="expense-date">Date</label>
            <input type="date" id="expense-date" required>
          </div>

          <div class="form-group">
            <label for="expense-note">Note / Description</label>
            <input type="text" id="expense-note"
                   placeholder="Optional description">
          </div>
        </div>

        <button type="submit">+ Add Expense</button>

      </form>
    </div>

    <!-- EXPENSE RECORDS -->
    <div class="card">
      <h3>Personal Expense Records</h3>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Category</th>
              <th>Note</th>
              <th>Amount</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="expense-list"></tbody>
        </table>
      </div>

      <p id="empty-message">No expenses recorded yet.</p>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
